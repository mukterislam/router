<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Router Admin</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/911/911244.png">

    <style>
        :root { --p: #2563eb; --bg: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 85%; max-width: 350px; }
        .icon { font-size: 50px; margin-bottom: 15px; }
        .btn { display: block; background: var(--p); color: white; text-decoration: none; padding: 15px; border-radius: 12px; font-weight: bold; border: none; width: 100%; cursor: pointer; font-size: 1.1rem; }
        .status { margin-top: 20px; font-size: 0.8rem; color: #64748b; }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">📡</div>
    <h2>Router Panel</h2>
    <p style="color:#64748b">IP: 192.168.1.1</p>
    <button onclick="location.href='http://192.168.1.1'" class="btn">Open Admin Panel</button>
    <div id="pwa-status" class="status">Initializing...</div>
</div>

<script>
    // সার্ভিস ওয়ার্কার রেজিস্ট্রেশন
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => {
                    console.log('SW Registered!');
                    document.getElementById('pwa-status').innerHTML = '<span style="color:#22c55e">● System Active</span>';
                })
                .catch(err => {
                    document.getElementById('pwa-status').innerHTML = '<span style="color:#ef4444">● Registration Failed</span>';
                });
        });
    }
</script>

</body>
</html>
