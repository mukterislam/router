<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100MB Live Speed Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .card { 
            background: white; 
            padding: 40px 30px; 
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.06); 
            text-align: center; 
            max-width: 380px; 
            width: 100%;
        }
        h2 { color: #1a1a1a; margin-bottom: 30px; font-size: 24px; font-weight: 700; }
        button { 
            background: #0066ff; 
            color: white; 
            border: none; 
            padding: 14px 30px; 
            font-size: 18px; 
            font-weight: 600;
            border-radius: 14px; 
            cursor: pointer; 
            transition: all 0.2s ease;
            width: 100%;
            margin-bottom: 25px;
        }
        button:hover { background: #0052cc; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }
        
        .speed-display {
            margin: 20px 0;
            min-height: 100px;
        }
        .status-text {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .speed-number {
            font-size: 48px; 
            color: #0066ff; 
            font-weight: 800;
            line-height: 1;
        }
        .unit {
            font-size: 18px;
            color: #64748b;
            font-weight: 500;
            margin-left: 5px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Internet Speed Test</h2>
    <button id="start-btn" onclick="runSpeedTest()">Start Test</button>
    
    <div class="speed-display">
        <div id="status" class="status-text">Ready</div>
        <div>
            <span id="speed" class="speed-number">0.00</span>
            <span id="unit" class="unit">Mbps</span>
        </div>
    </div>
</div>

<script>
async function runSpeedTest() {
    const speedEl = document.getElementById('speed');
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('start-btn');
    
    btn.disabled = true;
    statusEl.innerText = "Testing (100MB File)...";
    speedEl.style.color = "#0066ff";
    speedEl.innerText = "0.00";

    // ক্লাউডফ্লেয়ারের ১০০ মেগাবাইট (100,000,000 bytes) হাই-স্পিড টেস্ট ফাইল লিংক
    const testUrl = "https://speed.cloudflare.com/__down?bytes=100000000&v=" + new Date().getTime(); 
    
    try {
        const startTime = performance.now();
        const response = await fetch(testUrl, { cache: 'no-store' });
        
        if (!response.ok) throw new Error('Network error');
        
        const reader = response.body.getReader();
        let loadedBytes = 0;
        
        // প্রতি ১০০ মিলি-সেকেন্ড পর পর স্পিড ক্যালকুলেট করে লাইভ দেখাবে
        const intervalId = setInterval(() => {
            const currentTime = performance.now();
            const durationSec = (currentTime - startTime) / 1000;
            
            if (durationSec > 0 && loadedBytes > 0) {
                const bitsLoaded = loadedBytes * 8;
                const speedBps = bitsLoaded / durationSec;
                const speedMbps = speedBps / (1024 * 1024);
                
                speedEl.innerText = speedMbps.toFixed(2);
            }
        }, 100);

        // স্ট্রিম বা চিপসের মাধ্যমে ১০০ মেগাবাইটের ডাটা পার্ট বাই পার্ট রিসিভ করা হচ্ছে
        while(true) {
            const {done, value} = await reader.read();
            if (done) break;
            loadedBytes += value.length;
        }
        
        // ডাউনলোড কমপ্লিট, লাইভ টাইমার বন্ধ
        clearInterval(intervalId);
        
        // ফাইনাল এভারেজ স্পিড কাউন্ট
        const endTime = performance.now();
        const finalDuration = (endTime - startTime) / 1000;
        const finalBits = loadedBytes * 8;
        const finalMbps = (finalBits / finalDuration) / (1024 * 1024);

        // ফাইনাল রেজাল্ট শো এবং কালার চেঞ্জ
        statusEl.innerText = "Download Speed";
        speedEl.innerText = finalMbps.toFixed(2);
        speedEl.style.color = "#2ecc71"; // সফল হলে সবুজ দেখাবে

    } catch (error) {
        console.error(error);
        statusEl.innerText = "Error";
        speedEl.innerText = "0.00";
        speedEl.style.color = "#e74c3c";
    } finally {
        btn.disabled = false;
    }
}
</script>

</body>
</html>
