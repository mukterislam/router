    <style>
        :root { --p: #2563eb; --bg: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 85%; max-width: 350px; }
        .icon { font-size: 50px; margin-bottom: 15px; }
        .btn { display: block; background: var(--p); color: white; text-decoration: none; padding: 15px; border-radius: 12px; font-weight: bold; border: none; width: 100%; cursor: pointer; font-size: 1.1rem; }
        .status { margin-top: 20px; font-size: 0.8rem; color: #22c55e; }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">📡</div>
    <h2>Router Panel</h2>
    <p style="color:#64748b">192.168.1.1</p>
    <button onclick="location.href='http://192.168.1.1'" class="btn">Open Admin Panel</button>
    <div id="pwa-status" class="status">Checking PWA...</div>
</div>

<script>
    // Service Worker Registration
    if ('serviceWorker' in navigator) {
        const swCode = `
            const CACHE_NAME = 'router-v1';
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        
        navigator.serviceWorker.register(swUrl)
            .then(() => document.getElementById('pwa-status').innerText = '● PWA System Active')
            .catch(() => document.getElementById('pwa-status').innerText = 'PWA Error');
    }

    // PWA Install Prompt Logic
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('pwa-status').innerText = '● Ready to Install';
    });
</script>

</body>
</html>
