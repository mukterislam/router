<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Free Speedtest</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; font-size: 18px; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #ccc; }
        #result { margin-top: 20px; font-size: 24px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div class="card">
    <h2>Internet Speed Test</h2>
    <button id="start-btn" onclick="runSpeedTest()">Start Test</button>
    <div id="result">Click Start to measure speed</div>
</div>

<script>
function runSpeedTest() {
    const resultDiv = document.getElementById('result');
    const btn = document.getElementById('start-btn');
    
    btn.disabled = true;
    resultDiv.innerText = "Testing Download Speed...";

    // ১০ মেগাবাইটের একটি ফ্রি ডামি ফাইল (CDN থেকে)
    const imageAddr = "https://cachefly.cachefly.net/10mb.test?v=" + new Date().getTime(); 
    const downloadSize = 10485760; // 10 MB in bytes

    let startTime, endTime;
    let download = new Image();

    startTime = new Date().getTime();
    download.src = imageAddr;

    download.onload = function () {
        endTime = new Date().getTime();
        showResults(startTime, endTime, downloadSize);
        btn.disabled = false;
    }
    
    download.onerror = function () {
        resultDiv.innerText = "Error testing speed. Try again.";
        btn.disabled = false;
    }
}

function showResults(startTime, endTime, duration) {
    const durationSec = (endTime - startTime) / 1000;
    const bitsLoaded = duration * 8;
    const speedBps = bitsLoaded / durationSec;
    const speedKbps = speedBps / 1024;
    const speedMbps = speedKbps / 1024;

    document.getElementById('result').innerText = "Download Speed: " + speedMbps.toFixed(2) + " Mbps";
}
</script>

</body>
</html>
