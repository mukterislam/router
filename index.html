<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Speedtest Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            color: #f8fafc;
        }
        
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px; 
            border-radius: 28px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); 
            text-align: center; 
            max-width: 420px; 
            width: 90%;
            transition: all 0.3s ease;
        }

        h2 { 
            font-size: 22px; 
            font-weight: 600; 
            letter-spacing: 0.5px; 
            margin-bottom: 30px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        /* প্রফেশনাল স্পিডোমিটার সার্কেল */
        .speed-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 4px solid #334155;
            margin: 0 auto 30px auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* টেস্ট চলাকালীন গ্লোয়িং অ্যানিমেশন */
        .speed-circle.testing {
            border-color: #06b6d4;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.3);
            animation: pulse 1.5s infinite alternate;
        }

        .speed-circle.completed {
            border-color: #10b981;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.2);
        }

        .status-text {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .speed-number {
            font-size: 46px; 
            color: #ffffff; 
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .unit {
            font-size: 14px;
            color: #64748b;
            font-weight: 600;
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* পিং ও জিটার গ্রিড */
        .stats-grid {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            flex: 1;
            background: rgba(15, 23, 42, 0.4);
            padding: 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .stat-label {
            font-size: 11px;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 22px;
            color: #e2e8f0;
            font-weight: 700;
        }

        .stat-ms {
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
        }

        /* একশন বাটন */
        button { 
            background: linear-gradient(135deg, #0066ff 0%, #0052cc 100%);
            color: white; 
            border: none; 
            padding: 16px 30px; 
            font-size: 16px; 
            font-weight: 600;
            border-radius: 16px; 
            cursor: pointer; 
            transition: all 0.2s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.2);
            letter-spacing: 0.5px;
        }

        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 102, 255, 0.4);
        }

        button:active { transform: translateY(0); }
        button:disabled { 
            background: #334155; 
            color: #64748b;
            cursor: not-allowed; 
            transform: none;
            box-shadow: none;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(6, 182, 212, 0.2); }
            100% { box-shadow: 0 0 30px rgba(6, 182, 212, 0.5); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Network Speed</h2>
    
    <div id="circle-wrapper" class="speed-circle">
        <div id="status" class="status-text">Ready</div>
        <div id="speed" class="speed-number">0.0</div>
        <div class="unit">Mbps</div>
    </div>
    
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">PING</div>
            <div><span id="ping-val" class="stat-value">-</span><span class="stat-ms"> ms</span></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">JITTER</div>
            <div><span id="jitter-val" class="stat-value">-</span><span class="stat-ms"> ms</span></div>
        </div>
    </div>

    <button id="start-btn" onclick="startFullTest()">Run Speed Test</button>
</div>

<script>
async function measurePing() {
    const pingUrl = "https://speed.cloudflare.com/cdn-cgi/trace?v=" + new Date().getTime();
    let pings = [];
    
    for (let i = 0; i < 5; i++) {
        const start = performance.now();
        try {
            await fetch(pingUrl, { cache: 'no-store', mode: 'no-cors' });
            const end = performance.now();
            pings.push(end - start);
        } catch (e) {
            console.error(e);
        }
    }
    
    if(pings.length === 0) return { avgPing: 0, jitter: 0 };

    const avgPing = pings.reduce((a, b) => a + b, 0) / pings.length;
    
    let totalJitter = 0;
    for (let i = 1; i < pings.length; i++) {
        totalJitter += Math.abs(pings[i] - pings[i-1]);
    }
    const jitter = totalJitter / (pings.length - 1);

    return { avgPing, jitter };
}

async function startFullTest() {
    const speedEl = document.getElementById('speed');
    const statusEl = document.getElementById('status');
    const pingEl = document.getElementById('ping-val');
    const jitterEl = document.getElementById('jitter-val');
    const btn = document.getElementById('start-btn');
    const circleWrapper = document.getElementById('circle-wrapper');
    
    btn.disabled = true;
    circleWrapper.className = "speed-circle testing";
    
    statusEl.innerText = "Latency";
    pingEl.innerText = "-";
    jitterEl.innerText = "-";
    speedEl.innerText = "0.0";
    
    // ১. পিং টেস্ট
    const pingResults = await measurePing();
    pingEl.innerText = pingResults.avgPing.toFixed(0);
    jitterEl.innerText = pingResults.jitter.toFixed(0);

    // ২. ডাউনলোড স্পিড টেস্ট
    statusEl.innerText = "Testing";
    
    const testUrl = "https://speed.cloudflare.com/__down?bytes=100000000&v=" + new Date().getTime(); 
    
    try {
        const startTime = performance.now();
        const response = await fetch(testUrl, { cache: 'no-store' });
        
        if (!response.ok) throw new Error('Network error');
        
        const reader = response.body.getReader();
        let loadedBytes = 0;
        
        const intervalId = setInterval(() => {
            const currentTime = performance.now();
            const durationSec = (currentTime - startTime) / 1000;
            
            if (durationSec > 0 && loadedBytes > 0) {
                const bitsLoaded = loadedBytes * 8;
                const speedBps = bitsLoaded / durationSec;
                const speedMbps = speedBps / (1024 * 1024);
                
                speedEl.innerText = speedMbps.toFixed(1);
            }
        }, 100);

        while(true) {
            const {done, value} = await reader.read();
            if (done) break;
            loadedBytes += value.length;
        }
        
        clearInterval(intervalId);
        
        const endTime = performance.now();
        const finalDuration = (endTime - startTime) / 1000;
        const finalBits = loadedBytes * 8;
        const finalMbps = (finalBits / finalDuration) / (1024 * 1024);

        statusEl.innerText = "Download";
        speedEl.innerText = finalMbps.toFixed(1);
        circleWrapper.className = "speed-circle completed";

    } catch (error) {
        console.error(error);
        statusEl.innerText = "Error";
        speedEl.innerText = "0.0";
        circleWrapper.className = "speed-circle";
    } finally {
        btn.disabled = false;
    }
}
</script>

</body>
</html>
