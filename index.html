    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 350px;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: #eff6ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }

        h1 { font-size: 1.4rem; color: #1e293b; margin: 10px 0; }
        p { color: #64748b; font-size: 0.9rem; margin-bottom: 25px; }

        .btn {
            display: block;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.3s;
            border: none;
            width: 100%;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn:active { transform: scale(0.98); }

        .status {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #22c55e;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-box">📡</div>
    <h1>Router Admin</h1>
    <p>আপনি আপনার রাউটারের লোকাল নেটওয়ার্কে থাকলে নিচের বাটনে ক্লিক করুন।</p>
    
    <button onclick="openRouter()" class="btn">Open Admin Panel</button>

    <div class="status">
        <span style="height:8px; width:8px; background:#22c55e; border-radius:50%"></span>
        PWA Ready
    </div>
</div>

<script>
    // রাউটার পেজ ওপেন করার ফাংশন
    function openRouter() {
        // যেহেতু আইফ্রেম কাজ করবে না, তাই আমরা উইন্ডো রিডাইরেক্ট বা নতুন ট্যাব ব্যবহার করব
        window.location.href = "http://192.168.1.1";
    }

    // Service Worker রেজিস্টার করা (PWA এর জন্য বাধ্যতামূলক)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const swCode = `
                self.addEventListener('install', (e) => {
                    self.skipWaiting();
                });
                self.addEventListener('fetch', (e) => {
                    e.respondWith(fetch(e.request));
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl);
        });
    }
</script>

</body>
</html>
